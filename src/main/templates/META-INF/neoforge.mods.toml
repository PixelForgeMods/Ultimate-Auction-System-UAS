modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/NadirKhoulali/Ultimate-Auction-System-UAS/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
