side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "ultimatebankingsystem"
type = "required"
reason = "UAS settles auction payments through the Ultimate Banking System API."
versionRange = "[1.2.0,)"
ordering = "AFTER"
side = "BOTH"
