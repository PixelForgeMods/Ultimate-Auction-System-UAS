pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'ultimate_auction_system'

def ubsProjectCandidates = [
        '../Ultimate-Banking-System-UBS-main',
        '../Ultimate-Banking-System-UBS-dev-1.21.1-neoforge'
]
def ubsProjectDir = ubsProjectCandidates.collect { file(it) }.find { it.exists() }
def skipUbsComposite = gradle.startParameter.projectProperties.containsKey('skip_ubs_composite')
if (ubsProjectDir != null && !skipUbsComposite) {
    includeBuild(ubsProjectDir) {
        dependencySubstitution {
            substitute(module('net.austizz.ultimatebankingsystem:ultimatebankingsystem')).using(project(':'))
        }
    }
}
